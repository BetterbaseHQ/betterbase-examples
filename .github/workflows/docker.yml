name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-flight publish from main — a superseded push should
  # queue behind it, not kill a half-published image build.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: BetterbaseHQ/betterbase-examples

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Build context is the workspace root: this repo plus the sibling
      # checkouts the apps link against (same pins as check.yml — bump
      # together via `just release-pin` in betterbase-dev).
      - uses: actions/checkout@v7
        with:
          path: betterbase-examples
      - uses: actions/checkout@v7
        with:
          repository: BetterbaseHQ/betterbase
          ref: f08a442c507f836fb881977eea6a96fc3d41fb36
          path: betterbase
      - uses: actions/checkout@v7
        with:
          repository: BetterbaseHQ/json-joy-rs
          ref: 410e199748be7a9b18de3026e090bd9a7e737290
          path: json-joy-rs

      # The image copies the SDK's wasm-pack output (gitignored), so it is
      # built on the runner before docker build.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: betterbase
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: betterbase/js/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: betterbase/js/pnpm-lock.yaml
      - name: Build SDK wasm
        working-directory: betterbase/js
        run: |
          pnpm install --frozen-lockfile
          pnpm build:wasm

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: betterbase-examples/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
