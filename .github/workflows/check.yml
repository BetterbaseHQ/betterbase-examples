name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [shared, launchpad, tasks, notes, photos, board, passwords, chat]
    defaults:
      run:
        working-directory: betterbase-examples/${{ matrix.app }}
    steps:
      # Apps link the SDK TS source via link:../../betterbase/js, and the
      # SDK's betterbase-db crate path-depends on json-joy-rs — both must be
      # checked out as siblings of this repo.
      - uses: actions/checkout@v7
        with:
          path: betterbase-examples
      - uses: actions/checkout@v7
        with:
          repository: BetterbaseHQ/betterbase
          path: betterbase
      - uses: actions/checkout@v7
        with:
          repository: BetterbaseHQ/json-joy-rs
          path: json-joy-rs
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: betterbase
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: betterbase-examples/${{ matrix.app }}/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            betterbase-examples/${{ matrix.app }}/pnpm-lock.yaml
            betterbase-examples/shared/pnpm-lock.yaml
            betterbase/js/pnpm-lock.yaml
      # The SDK is consumed as linked TS source: its imports resolve from its
      # own node_modules, and tsc/vite need the wasm-pack pkg/ output that the
      # SDK repo gitignores — install deps and build wasm before checking.
      - name: Build SDK
        working-directory: betterbase/js
        run: |
          pnpm install --frozen-lockfile
          pnpm build:wasm
      # Apps resolve @betterbase/examples-shared types from shared/dist, which
      # is gitignored — build it in this job (each matrix job is isolated).
      - name: Build shared package
        if: matrix.app != 'shared'
        working-directory: betterbase-examples/shared
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
